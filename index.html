<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Student Registration Portal">
    <meta name="author" content="Student Registration Portal">

    <title>Student Registration Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="header-content">
        <h1>Student Registration Portal</h1>
        <p>Register your details and publish your information</p>
    </div>
</header>

<main class="container">

    <!-- Registration -->
    <section class="card">
        <h2>📝 Student Registration</h2>

        <form id="studentForm">

            <div class="form-group">
                <label for="name">Student Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    autocomplete="name"
                    required>
            </div>

            <div class="form-group">
                <label for="className">Class</label>
                <input
                    type="text"
                    id="className"
                    placeholder="Example: IT-1"
                    required>
            </div>

            <div class="form-group">
                <label for="enrollment">Enrollment Number</label>
                <input
                    type="text"
                    id="enrollment"
                    placeholder="Enter enrollment number"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    autocomplete="tel"
                    required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bloodGroup">Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">
                Register & Publish
            </button>

        </form>

        <p id="successMessage" class="success-message"></p>
    </section>


    <!-- Student List -->
    <section class="card">

        <div class="list-header">
            <h2>📋 Published Students</h2>
            <span id="studentCount">0 Students</span>
        </div>

        <div class="table-container">

            <table id="studentTable">

                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Enrollment No.</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Blood Group</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>

            </table>

            <div id="emptyMessage" class="empty-message">
                No students registered yet.
            </div>

        </div>

    </section>

</main>


<footer>
    <p>© 2026 Student Registration Portal</p>
</footer>


<script src="script.js"></script>

</body>
</html>
