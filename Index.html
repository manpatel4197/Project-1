<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f5f9;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        h2 {
            color: #1e293b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            margin: 0;
            padding: 7px 10px;
            width: auto;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Registration Portal</h1>
    <p>Register your details and publish them</p>
</header>

<div class="container">

    <!-- Registration Form -->
    <div class="card">

        <h2>📝 Student Registration</h2>

        <form id="studentForm">

            <label>Student Name</label>
            <input type="text" id="name"
                   placeholder="Enter student name" required>

            <label>Class</label>
            <input type="text" id="className"
                   placeholder="Example: IT-1" required>

            <label>Enrollment Number</label>
            <input type="text" id="enrollment"
                   placeholder="Enter enrollment number" required>

            <label>Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number" required>

            <!-- Gender -->
            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <!-- Blood Group -->
            <label>Blood Group</label>
            <select id="bloodGroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>

            <button type="submit">
                Register & Publish
            </button>

        </form>

    </div>


    <!-- Published Students -->
    <div class="card">

        <h2>📋 Published Students</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Enrollment No.</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Blood Group</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>

            </table>

            <div id="emptyMessage" class="empty">
                No students registered yet.
            </div>

        </div>

    </div>

</div>


<script>

    const form = document.getElementById("studentForm");
    const studentList = document.getElementById("studentList");
    const emptyMessage = document.getElementById("emptyMessage");

    let students =
        JSON.parse(localStorage.getItem("students")) || [];

    displayStudents();


    // Register student
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const student = {

            name: document.getElementById("name").value,

            className:
                document.getElementById("className").value,

            enrollment:
                document.getElementById("enrollment").value,

            phone:
                document.getElementById("phone").value,

            gender:
                document.getElementById("gender").value,

            bloodGroup:
                document.getElementById("bloodGroup").value
        };


        students.push(student);

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

        form.reset();

        displayStudents();
    });


    // Display students
    function displayStudents() {

        studentList.innerHTML = "";

        if (students.length === 0) {

            emptyMessage.style.display = "block";

            return;
        }

        emptyMessage.style.display = "none";


        students.forEach(function(student, index) {

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${index + 1}</td>

                <td>${student.name}</td>

                <td>${student.className}</td>

                <td>${student.enrollment}</td>

                <td>${student.phone}</td>

                <td>${student.gender}</td>

                <td>${student.bloodGroup}</td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${index})">
                        Delete
                    </button>
                </td>
            `;

            studentList.appendChild(row);

        });
    }


    // Delete student
    function deleteStudent(index) {

        students.splice(index, 1);

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );

        displayStudents();
    }

</script>

</body>
</html>
